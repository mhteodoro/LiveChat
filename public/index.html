<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/output.css" />
</head>

<body>


    <div class="flex h-screen items-center justify-center bg-slate-950 p-4">
        <div
            class="bg-slate-900 h-[200px] w-[300px] shadow-2xl rounded-lg mr-4 p-2 overflow-hidden border border-slate-700 bg-slate-900 shadow-2xl">
            <h1 class="mb-5 font-bold text-white text-xl flex flex-col items-center justify-center gap-4">Login </h1>
            <form class="flex flex-col items-center justify-center gap-4" onsubmit="handleSubmit(event)">
                <input type="text" name="name" id="name"
                    class="h-[40px] w-[250px] bg-blue-50  border-gray-950 rounded-lg" />
                <button class="font-bold bg-blue-500 h-[40px] w-[100px] rounded-lg" name="btnLogin" id="btnLogin"
                    type="submit">
                    Entrar
                </button>
            </form>
        </div>
        <div>
            <div id="chatBoxx"
                class="blur-md break-words text-white flex h-[500px] w-[700px] overflow-y-scroll flex-col overflow-hidden rounded-lg border border-slate-700 bg-slate-900 shadow-2xl mb-2 p-2">
            </div>
            <form onsubmit="handleSendMessage(event)">
                <input class="bg-blue-50  border-gray-950 h-[40px] w-[600px] rounded-lg" type="text" name="message"
                    id="message" disabled />
                <button class="bg-blue-500 h-[40px] w-[100px] rounded-lg font-bold" name="btnMsg" id="btnMsg" disabled>
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
